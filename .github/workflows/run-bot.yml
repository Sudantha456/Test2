name: Run ReClip Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Deno (Ultra-fast JS runtime for yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install System Dependencies (FFmpeg, Aria2)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U pyrogram tgcrypto curl_cffi cloudscraper
          pip install -U --pre "yt-dlp[default,curl-cffi]"

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YTDLP_PROXY: ""
        run: |
          python3 bot.py
